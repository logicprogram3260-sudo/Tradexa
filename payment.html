<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradexa Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #06101d;
      color: #fff;
      min-height: 100vh;
    }
    #tradexaPayModal .nav-pills .nav-link.active {
      background-color: #d4af37 !important;
      color: #000 !important;
    }
  </style>
</head>
<body>

<!-- Payment Checkout Modal -->
<div class="modal fade" id="tradexaPayModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-white" style="background-color: #111111; border: 1px solid #d4af37; border-radius: 16px;">
      
      <!-- Modal Header -->
      <div class="modal-header border-bottom border-secondary">
        <div>
          <h5 class="modal-title fw-bold text-warning mb-0" id="modalProductName">Tradexa Indicator</h5>
          <small class="text-secondary" id="modalPlanName">ONE MONTH Access</small>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body p-4">
        
        <!-- Payment Method Tabs -->
        <ul class="nav nav-pills nav-fill mb-3 p-1 rounded" style="background-color: #1c1c1c;" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active fw-semibold text-white" data-bs-toggle="pill" data-bs-target="#tab-upi" type="button">UPI / GPay</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-semibold text-white" data-bs-toggle="pill" data-bs-target="#tab-bep20" type="button">USDT (BEP20)</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link fw-semibold text-white" data-bs-toggle="pill" data-bs-target="#tab-trc20" type="button">USDT (TRC20)</button>
          </li>
        </ul>

        <!-- Tab Contents -->
        <div class="tab-content text-center">
          
          <!-- 1. Google Pay / UPI Tab -->
          <div class="tab-pane fade show active" id="tab-upi">
            <h4 class="fw-bold text-warning mb-2" id="modalInrPrice">₹2,999</h4>
            <div class="bg-white p-2 rounded-3 d-inline-block mb-2">
              <img src="gpay-qr.jpg" alt="GPay QR" style="width: 180px; height: 180px; object-fit: contain;">
            </div>
            <p class="small text-light mb-1">Aboobacker Sidheeque</p>
            <div class="input-group input-group-sm mb-3">
              <input type="text" class="form-control bg-dark text-white border-secondary text-center" id="upiIdText" value="aboobackermt533@oksbi" readonly>
              <button class="btn btn-outline-warning" onclick="copyAddress('upiIdText')">Copy UPI</button>
            </div>
          </div>

          <!-- 2. Binance USDT (BEP20) Tab -->
          <div class="tab-pane fade" id="tab-bep20">
            <h4 class="fw-bold text-warning mb-2" id="modalUsdtPrice1">30 USDT</h4>
            <span class="badge bg-warning text-dark mb-2">Network: BNB Smart Chain (BEP20)</span><br>
            <div class="bg-white p-2 rounded-3 d-inline-block mb-2">
              <img src="binance-bep20.jpg" alt="BEP20 QR" style="width: 180px; height: 180px; object-fit: contain;">
            </div>
            <div class="input-group input-group-sm mb-3">
              <input type="text" class="form-control bg-dark text-white border-secondary" id="bep20Addr" value="0x48862a8dabd4a11c342c5447284f80de95697a64" readonly>
              <button class="btn btn-outline-warning" onclick="copyAddress('bep20Addr')">Copy</button>
            </div>
          </div>

          <!-- 3. Binance USDT (TRC20) Tab -->
          <div class="tab-pane fade" id="tab-trc20">
            <h4 class="fw-bold text-warning mb-2" id="modalUsdtPrice2">30 USDT</h4>
            <span class="badge bg-danger text-white mb-2">Network: Tron (TRC20)</span><br>
            <div class="bg-white p-2 rounded-3 d-inline-block mb-2">
              <img src="binance-trc20.jpg" alt="TRC20 QR" style="width: 180px; height: 180px; object-fit: contain;">
            </div>
            <div class="input-group input-group-sm mb-3">
              <input type="text" class="form-control bg-dark text-white border-secondary" id="trc20Addr" value="TEx3ijfTyd9aewYRjRwQVvA8HXrq3BQMxq" readonly>
              <button class="btn btn-outline-warning" onclick="copyAddress('trc20Addr')">Copy</button>
            </div>
          </div>

        </div>

        <hr class="border-secondary">

        <!-- Verification Inputs -->
        <div class="text-start">
          <div class="mb-2">
            <label class="form-label small text-secondary mb-1">TradingView Username (For Access)</label>
            <input type="text" id="tvUsername" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Enter your TradingView ID" required>
          </div>
          <div class="mb-3">
            <label class="form-label small text-secondary mb-1">UTR Number / Transaction Hash (TxID)</label>
            <input type="text" id="txHash" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Paste UPI Ref ID or Crypto TxID" required>
          </div>
          <button class="btn btn-warning w-100 fw-bold text-dark" onclick="submitOrder()">
            Confirm & Submit Order
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function copyAddress(elementId) {
  const copyText = document.getElementById(elementId);
  copyText.select();
  navigator.clipboard.writeText(copyText.value);
  alert("Copied: " + copyText.value);
}

function submitOrder() {
  const tvUser = document.getElementById('tvUsername').value.trim();
  const txId = document.getElementById('txHash').value.trim();
  const product = document.getElementById('modalProductName').innerText;
  const plan = document.getElementById('modalPlanName').innerText;
  const inr = document.getElementById('modalInrPrice').innerText;
  const usdt = document.getElementById('modalUsdtPrice1').innerText;

  if (!tvUser || !txId) {
    alert("ദയവായി TradingView Username-ഉം Transaction ID-യും നൽകുക.");
    return;
  }

  const whatsappNumber = "918943623260";
  const msg = `New Indicator Order:%0AProduct: ${product}%0APlan: ${plan}%0AINR: ${inr}%0AUSDT: ${usdt}%0ATradingView ID: ${tvUser}%0ATxID/UTR: ${txId}`;
  window.open(`https://wa.me/${whatsappNumber}?text=${msg}`, '_blank');
}

document.addEventListener('DOMContentLoaded', function () {
  const params = new URLSearchParams(window.location.search);
  let checkout = {
    product: 'Tradexa Hunter V1',
    plan: 'ONE MONTH',
    inr: '2999',
    usdt: '30'
  };

  if (params.toString()) {
    if (params.has('product')) checkout.product = params.get('product').trim();
    if (params.has('plan')) checkout.plan = params.get('plan').trim();
    if (params.has('inr')) checkout.inr = params.get('inr').trim();
    if (params.has('usdt')) checkout.usdt = params.get('usdt').trim();
  } else {
    try {
      const saved = JSON.parse(localStorage.getItem('tradexaCheckout') || 'null');
      if (saved) checkout = { ...checkout, ...saved };
    } catch (error) {
      localStorage.removeItem('tradexaCheckout');
    }
  }

  const inrNumber = Number(String(checkout.inr).replace(/[^\d]/g, '')) || 2999;
  const usdtNumber = String(checkout.usdt).replace(/[^\d]/g, '') || '30';

  document.getElementById('modalProductName').textContent = checkout.product;
  document.getElementById('modalPlanName').textContent = checkout.plan + ' Access';
  document.getElementById('modalInrPrice').textContent =
    '₹' + inrNumber.toLocaleString('en-IN');
  document.getElementById('modalUsdtPrice1').textContent = usdtNumber + ' USDT';
  document.getElementById('modalUsdtPrice2').textContent = usdtNumber + ' USDT';

  localStorage.setItem('tradexaCheckout', JSON.stringify(checkout));

  const modalElement = document.getElementById('tradexaPayModal');
  if (modalElement) {
    let redirectingToIndicators = false;
    const redirectToIndicators = function () {
      if (redirectingToIndicators) return;
      redirectingToIndicators = true;
      window.location.href = 'indicator.html';
    };

    modalElement.addEventListener('hidden.bs.modal', redirectToIndicators);

    const closeButton = modalElement.querySelector('.btn-close');
    if (closeButton) {
      closeButton.addEventListener('click', redirectToIndicators);
    }

    bootstrap.Modal.getOrCreateInstance(modalElement).show();
  }
});
</script>
</body>
</html>
